# A moves to the default pose, Start prepares the arms for the first frame, and B plays.
# Clip completion or a stopped source leaves GMT tracking the last valid frame.
initial: damped

states:
  damped:
    type: damping
    transitions:
      A: move_to_default_qpos

  move_to_default_qpos:
    type: move_to_target_pos
    transitions:
      Start: prepare_first_frame_arms
      X: damped

  # init befor entering GMT policy
  prepare_first_frame_arms:
    type: arm_transition
    direction: to_reference
    duration: 2.0
    max_joint_speed: 1.0
    transitions:
      B: hold_first_frame_motion
      reference_lost: run_gmt_policy
      X: damped

  # hold GMT policy at first frame of reference motion
  hold_first_frame_motion:
    type: policy
    hold_reference: true
    reset_policy: false  # Keep the reference selected during arm preparation.
    entry_ema:
      frames: 50
      alpha: 0.1
    transitions:
      B: run_gmt_policy
      reference_ready: prepare_first_frame_arms
      X: damped

  # running GMT policy
  run_gmt_policy:
    type: policy
    hold_reference: false
    reset_policy: false
    transitions:
      reference_ready: prepare_first_frame_arms
      X: damped
